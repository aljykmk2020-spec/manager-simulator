<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>主管思維模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #FAF8F4; color: #2C2416; font-family: 'Noto Sans TC', sans-serif; }

  .app { max-width: 640px; margin: 0 auto; padding: 20px 16px 32px; min-height: 100vh; display: flex; flex-direction: column; }

  .header { margin-bottom: 16px; }
  .title { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700; color: #4A3728; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #8B7355; line-height: 1.6; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip { font-size: 12px; padding: 6px 13px; border-radius: 20px; border: 1px solid #D4C4A8; background: #FFF8EE; color: #6B5140; cursor: pointer; line-height: 1.4; transition: background 0.15s; user-select: none; }
  .chip:hover, .chip:active { background: #F0E6D3; }

  .chat { flex: 1; min-height: 300px; max-height: 52vh; overflow-y: auto; border: 1px solid #E8DDD0; border-radius: 14px; background: #FFFDF9; padding: 14px 12px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 86%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-label { font-size: 11px; color: #A89880; }
  .bubble { padding: 11px 15px; font-size: 14px; line-height: 1.78; }
  .msg.user .bubble { background: #4A3728; color: #FFF8F0; border-radius: 14px 14px 4px 14px; }
  .msg.assistant .bubble { background: #FFF5E6; color: #2C2416; border: 1px solid #E8DDD0; border-radius: 14px 14px 14px 4px; }
  .bubble p { margin-bottom: 7px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble .bul { display: flex; gap: 8px; margin-bottom: 5px; }
  .bubble .bul-arrow { color: #8B7355; flex-shrink: 0; margin-top: 2px; }
  .bubble strong { font-weight: 600; }

  .dots { display: flex; gap: 6px; padding: 13px 16px; background: #FFF5E6; border: 1px solid #E8DDD0; border-radius: 14px 14px 14px 4px; align-self: flex-start; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #C4A882; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

  .input-row { display: flex; gap: 9px; align-items: flex-end; margin-bottom: 10px; }
  textarea { flex: 1; resize: none; padding: 11px 13px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif; border-radius: 11px; border: 1px solid #D4C4A8; background: #FFFDF9; color: #2C2416; line-height: 1.6; min-height: 70px; outline: none; transition: border-color 0.2s; }
  textarea:focus { border-color: #8B7355; }
  textarea::placeholder { color: #B8A890; }
  .send-btn { height: 70px; padding: 0 20px; font-size: 14px; font-weight: 500; font-family: 'Noto Sans TC', sans-serif; border-radius: 11px; background: #4A3728; border: none; color: #FFF8F0; cursor: pointer; flex-shrink: 0; transition: opacity 0.2s; }
  .send-btn:disabled { opacity: 0.45; cursor: default; }
  .send-btn:not(:disabled):active { opacity: 0.8; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tool-btn { font-size: 12px; padding: 7px 14px; border-radius: 9px; border: 1px solid #D4C4A8; background: #FFFDF9; color: #6B5140; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: background 0.15s; }
  .tool-btn:hover, .tool-btn:active { background: #F0E6D3; }
  .reset-btn { margin-left: auto; font-size: 12px; color: #A89880; background: none; border: none; cursor: pointer; text-decoration: underline; font-family: 'Noto Sans TC', sans-serif; }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #4A3728; color: #FFF8F0; font-size: 13px; padding: 10px 22px; border-radius: 22px; white-space: nowrap; z-index: 999; font-family: 'Noto Sans TC', sans-serif; box-shadow: 0 4px 18px rgba(0,0,0,0.18); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* API key modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(44,36,22,0.45); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: #FFFDF9; border-radius: 16px; padding: 24px 22px; max-width: 420px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }
  .modal h3 { font-family: 'Noto Serif TC', serif; font-size: 17px; color: #4A3728; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: #6B5140; line-height: 1.7; margin-bottom: 14px; }
  .modal a { color: #8B7355; }
  .modal input { width: 100%; padding: 10px 13px; font-size: 14px; border-radius: 9px; border: 1px solid #D4C4A8; background: #FAF8F4; color: #2C2416; outline: none; font-family: 'Noto Sans TC', sans-serif; margin-bottom: 12px; }
  .modal input:focus { border-color: #8B7355; }
  .modal-btn { width: 100%; padding: 11px; font-size: 14px; font-weight: 500; font-family: 'Noto Sans TC', sans-serif; border-radius: 9px; background: #4A3728; border: none; color: #FFF8F0; cursor: pointer; }
  .modal-note { font-size: 11px; color: #A89880; margin-top: 10px; line-height: 1.6; text-align: center; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="title">主管思維模擬器</div>
    <div class="subtitle">描述你遇到的職場情境，用主管的思考邏輯來分析應對方式。</div>
  </div>

  <div class="chips" id="chips">
    <span class="chip" onclick="fillChip('跨部門對某個做法有歧見，我不確定要怎麼處理')">跨部門意見分歧</span>
    <span class="chip" onclick="fillChip('主管交辦一件事，但我覺得做法有問題，不知道要不要說')">接到任務有疑慮</span>
    <span class="chip" onclick="fillChip('廠商來函主張某項權利，我需要決定要怎麼回應')">廠商來函回應</span>
    <span class="chip" onclick="fillChip('需要去跟主管或高層報告一件有爭議的事')">向上匯報準備</span>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-row">
    <textarea id="input" placeholder="描述你遇到的情況…&#10;（Enter 送出，Shift+Enter 換行）" rows="3"></textarea>
    <button class="send-btn" id="sendBtn" onclick="send()">送出</button>
  </div>

  <div class="toolbar">
    <button class="tool-btn" onclick="copyChat()">複製對話</button>
    <button class="tool-btn" onclick="downloadChat('txt')">下載 .txt</button>
    <button class="tool-btn" onclick="downloadChat('md')">下載 .md</button>
    <button class="reset-btn" onclick="resetChat()">重新開始</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- API Key Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>設定 API 金鑰</h3>
    <p>這個工具需要 Anthropic API 金鑰才能運作。金鑰只會存在你的瀏覽器裡，不會上傳到任何地方。</p>
    <p>還沒有金鑰？前往 <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> 免費申請。</p>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
    <button class="modal-btn" onclick="saveKey()">儲存並開始使用</button>
    <div class="modal-note">金鑰儲存於瀏覽器 localStorage，清除瀏覽器資料後需重新輸入。</div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `你是一位台灣企業法務部門的資深主管，擁有超過十五年的法務及合規管理經驗。你正在扮演 Fiona（一位法務部門初級主管）的直屬主管，協助她用你的思考框架來分析職場情境。

你的核心思考邏輯如下：

1. 釐清角色定位優先
   - 法務是顧問與分析者，不是業務決策者
   - 遇到跨部門爭議，先問「這件事的決策權責在哪個單位？」
   - 法務的影響力來自分析品質，不來自主導權

2. 不正面對抗，用分析影響決策
   - 不主張立場，而是提供完整的利弊分析，讓對方自己走到正確結論
   - 給出兩到三個選項，讓決策者選，而不是只提一個答案
   - 若與其他單位有歧見，用「提供意見供參考」代替「我們認為應該這樣做」

3. 著眼制度化，不只處理個案
   - 個案處理完要建立原則，避免下次重來
   - 問自己：「這個做法以後能不能一致套用？」
   - 有機會就把處理方式書面化，作為日後依據

4. 風險意識要向後看
   - 不只問「現在怎麼辦」，也問「這樣做，三個月後會有什麼問題？」
   - 考慮慣例效應：今天的做法，會不會成為廠商或對方單位日後援引的依據？
   - 注意程序正當性，不只是結果對不對

5. 向上匯報的邏輯
   - 不要只帶問題，要帶選項與建議
   - 幫主管框定「你需要做的決策是什麼」
   - 把情緒面（面子、不爽）轉換成制度面的語言

請用以下方式回應 Fiona：
- 先簡短點出她情境中的核心問題或盲點（一兩句話）
- 再提出二到四個主管會追問的關鍵問題，幫她想清楚
- 最後給出一個具體的建議方向或下一步

語氣：像資深前輩在一對一談話，直接、務實、不說廢話。使用台灣繁體中文慣用語，語氣帶有關心但不過度溫柔。不要用「視頻」、「軟件」等簡中用語。不要超過三百五十字。`;

let history = [];
let plainLog = [];

// Init
window.addEventListener('DOMContentLoaded', () => {
  const key = localStorage.getItem('anthropic_key');
  if (key) {
    document.getElementById('modalOverlay').style.display = 'none';
    addMsg('assistant', '你好，把你遇到的情況說給我聽，我會用主管的思維角度來幫你想清楚下一步。\n\n你可以直接描述情境，不用太正式，怎麼想的就怎麼說。');
  }
  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
});

function saveKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-')) { showToast('請輸入正確的 API 金鑰（以 sk- 開頭）'); return; }
  localStorage.setItem('anthropic_key', key);
  document.getElementById('modalOverlay').style.display = 'none';
  addMsg('assistant', '你好，把你遇到的情況說給我聽，我會用主管的思維角度來幫你想清楚下一步。\n\n你可以直接描述情境，不用太正式，怎麼想的就怎麼說。');
}

function fillChip(text) {
  document.getElementById('input').value = text;
  document.getElementById('input').focus();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatReply(text) {
  const lines = text.split('\n').filter(l => l.trim());
  let html = '';
  for (const line of lines) {
    const t = line.trim();
    const isBullet = /^[-•▪▶→●]\s/.test(t);
    const content = isBullet ? t.replace(/^[-•▪▶→●]\s+/, '') : t;
    const formatted = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    if (isBullet) {
      html += `<div class="bul"><span class="bul-arrow">▸</span><span>${formatted}</span></div>`;
    } else {
      html += `<p>${formatted}</p>`;
    }
  }
  return html;
}

function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? '我' : '主管視角';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'assistant') bubble.innerHTML = formatReply(text);
  else bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  plainLog.push({ role, text });
}

function showLoading() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.id = 'loading';
  div.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loading');
  if (el) el.remove();
}

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  const key = localStorage.getItem('anthropic_key');
  if (!text || btn.disabled) return;
  if (!key) { document.getElementById('modalOverlay').style.display = 'flex'; return; }

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  btn.disabled = true;
  showLoading();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const reply = data.content?.find(b => b.type === 'text')?.text || '抱歉，無法取得回應。';
    history.push({ role: 'assistant', content: reply });
    removeLoading();
    addMsg('assistant', reply);
  } catch (err) {
    removeLoading();
    addMsg('assistant', `連線失敗：${err.message || '請確認 API 金鑰是否正確。'}`);
  }
  btn.disabled = false;
}

function buildText() {
  const now = new Date();
  const d = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  let out = `主管思維模擬器 對話紀錄\n匯出時間：${d}\n${'─'.repeat(36)}\n\n`;
  plainLog.forEach(m => { out += `【${m.role === 'user' ? '我' : '主管視角'}】\n${m.text}\n\n`; });
  return out;
}

function buildMd() {
  const now = new Date();
  const d = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  let out = `# 主管思維模擬器 對話紀錄\n\n> 匯出時間：${d}\n\n---\n\n`;
  plainLog.forEach(m => {
    if (m.role === 'user') out += `**我：**\n\n${m.text}\n\n`;
    else out += `**主管視角：**\n\n${m.text}\n\n---\n\n`;
  });
  return out;
}

function copyChat() {
  if (plainLog.length <= 1) { showToast('目前還沒有對話內容'); return; }
  navigator.clipboard.writeText(buildText()).then(() => showToast('✓ 已複製，可直接貼到 Notion')).catch(() => showToast('複製失敗，請改用下載功能'));
}

function downloadChat(fmt) {
  if (plainLog.length <= 1) { showToast('目前還沒有對話內容'); return; }
  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const content = fmt === 'md' ? buildMd() : buildText();
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `主管思維模擬_${stamp}.${fmt}`; a.click();
  URL.revokeObjectURL(url);
  showToast(`✓ 已下載 .${fmt} 檔案`);
}

function resetChat() {
  history = []; plainLog = [];
  document.getElementById('chat').innerHTML = '';
  addMsg('assistant', '你好，把你遇到的情況說給我聽，我會用主管的思維角度來幫你想清楚下一步。\n\n你可以直接描述情境，不用太正式，怎麼想的就怎麼說。');
}
</script>
</body>
</html>
